<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multimodal deepfake detection and digital forensics analysis system" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="ForensIQ" />
    <meta property="og:description" content="Autonomous Digital Forensics & Deepfake Detection" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ForensIQ | Autonomous Digital Forensics Platform" />
    <meta name="twitter:description" content="Multimodal deepfake detection and digital forensics analysis system" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ForensIQ | Autonomous Digital Forensics Platform</title>
    <style>
      .ai-matrix-loader {
        width: 120px;
        height: 160px;
        margin: 30px auto;
        position: relative;
        perspective: 800px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }
      .ai-matrix-loader .digit {
        color: #00ff88;
        font-family: monospace;
        font-size: 18px;
        text-align: center;
        text-shadow: 0 0 5px #00ff88;
        animation: matrix-fall 2s infinite, matrix-flicker 0.5s infinite;
        opacity: 0;
      }
      .ai-matrix-loader .digit:nth-child(1) { animation-delay: 0.1s; }
      .ai-matrix-loader .digit:nth-child(2) { animation-delay: 0.3s; }
      .ai-matrix-loader .digit:nth-child(3) { animation-delay: 0.5s; }
      .ai-matrix-loader .digit:nth-child(4) { animation-delay: 0.7s; }
      .ai-matrix-loader .digit:nth-child(5) { animation-delay: 0.9s; }
      .ai-matrix-loader .digit:nth-child(6) { animation-delay: 1.1s; }
      .ai-matrix-loader .digit:nth-child(7) { animation-delay: 1.3s; }
      .ai-matrix-loader .digit:nth-child(8) { animation-delay: 1.5s; }
      .ai-matrix-loader .glow {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
        animation: matrix-pulse 2s infinite;
      }
      @keyframes matrix-fall {
        0% { transform: translateY(-50px) rotateX(90deg); opacity: 0; }
        20%, 80% { transform: translateY(0) rotateX(0deg); opacity: 0.8; }
        100% { transform: translateY(50px) rotateX(-90deg); opacity: 0; }
      }
      @keyframes matrix-flicker {
        0%, 19%, 21%, 100% { opacity: 0.8; }
        20% { opacity: 0.2; }
      }
      @keyframes matrix-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="boot-loader">
      <div class="ai-matrix-loader">
        <div class="digit">0</div>
        <div class="digit">1</div>
        <div class="digit">0</div>
        <div class="digit">1</div>
        <div class="digit">1</div>
        <div class="digit">0</div>
        <div class="digit">0</div>
        <div class="digit">1</div>
        <div class="glow"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
